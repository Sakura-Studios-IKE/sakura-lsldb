name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build lsldb (POSIX)
        if: runner.os != 'Windows'
        run: make CC=cc

      - name: Build lsldb (Windows MinGW)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make CC=gcc

      # The integration test spawns sakura-slemu; build it from a sibling
      # checkout so we exercise the real protocol.
      - name: Build sibling sakura-lslc + sakura-slemu
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/Sakura-Studios-IKE/sakura-lslc.git ../sakura-lslc
          git clone --depth 1 https://github.com/Sakura-Studios-IKE/sakura-slemu.git ../sakura-slemu
          make -C ../sakura-lslc CC=cc
          make -C ../sakura-slemu CC=cc

      - name: Integration test
        if: runner.os != 'Windows'
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: lsldb-${{ matrix.os }}
          path: |
            lsldb
            lsldb.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: ./artifacts }
      - id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {flag=1; next} flag && /^## \[/ {flag=0} flag' CHANGELOG.md > release-body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: sakura-lsldb ${{ steps.changelog.outputs.version }}
          body_path: release-body.md
          files: |
            artifacts/lsldb-ubuntu-latest/lsldb
            artifacts/lsldb-macos-latest/lsldb
            artifacts/lsldb-windows-latest/lsldb.exe

  publish-aur:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: sakura-lsldb
          pkgbuild: packaging/aur/sakura-lsldb/PKGBUILD
          commit_username: Shiho Sakura
          commit_email: shiho@sakurastudios.eu
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "v${{ github.ref_name }}"
